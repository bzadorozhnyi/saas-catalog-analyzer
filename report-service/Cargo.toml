[package]
name = "report-service"
version = "0.1.0"
edition = "2024"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
excessive_nesting = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.150.0"
aws-sdk-sqs = "1.113.0"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.26"
opentelemetry = "0.33.0"
opentelemetry-http = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
] }
opentelemetry_sdk = { version = "0.33.0", features = [
    "experimental_trace_batch_span_processor_with_async_runtime",
    "rt-tokio",
] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-kit = { version = "0.15.1", features = ["system-packages", "system-downloader"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
