repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (report-service)
        entry: bash -c 'cd report-service && cargo fmt --check'
        language: system
        files: ^report-service/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (report-service)
        entry: bash -c 'cd report-service && SQLX_OFFLINE=true cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^report-service/.*\.(rs|toml)$
        pass_filenames: false
