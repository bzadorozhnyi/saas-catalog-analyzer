[project]
name = "saas-catalog-analyzer"
version = "0.1.0"
description = "Training playground for detecting duplicate SaaS subscriptions using pydantic_ai and embeddings"
readme = "README.md"
authors = [
    { name = "bzadorozhnyi", email = "bohzador@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "logfire[fastapi]>=5.1.0",
    "pgvector>=0.5.0",
    "pydantic-ai>=2.46.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]
